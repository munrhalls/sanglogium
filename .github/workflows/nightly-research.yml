name: Nightly Codebase Research Loop
# READ-ONLY RESEARCH ONLY — NO CODE MODIFICATIONS PERMITTED
# Purpose: Automated analysis → recommendations → human decision

on:
  schedule:
    - cron: "0 2 * * *"  # 2:00 AM UTC (after daily-rebuild)
  workflow_dispatch:      # Manual trigger for testing

concurrency:
  group: nightly-research
  cancel-in-progress: false

permissions:
  contents: read          # READ-ONLY — no write permissions
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Data Integrity Validation
  # ─────────────────────────────────────────────────────────────────
  data-integrity:
    name: Data Integrity Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1    # Shallow clone — faster, sufficient for analysis
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Data Integrity Analysis
        id: analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Create output directory
          mkdir -p _project/research/nightly/$(date +%Y-%m-%d)
          
          # Run validation script (outputs markdown report)
          node scripts/research/data-integrity.mjs || true
          
          # If script fails, create fallback report
          if [ ! -f "_project/research/nightly/$(date +%Y-%m-%d)/DI-$(date +%Y-%m-%d).md" ]; then
            echo "# Data Integrity Report — $(date +%Y-%m-%d)
**Status:** ⚠️ Analysis Error
**Error:** Validation script failed to execute
**Action:** Check workflow logs" > "_project/research/nightly/$(date +%Y-%m-%d)/DI-$(date +%Y-%m-%d).md"
          fi
        continue-on-error: true
      
      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-report
          path: _project/research/nightly/*/DI-*.md
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Schema-Query Contract Validation
  # ─────────────────────────────────────────────────────────────────
  contract-validation:
    name: Schema-Query Contract Check
    runs-on: ubuntu-latest
    needs: data-integrity  # Sequential to avoid rate limits
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Contract Validation
        id: validation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p _project/research/nightly/$(date +%Y-%m-%d)
          node scripts/research/contract-validation.mjs || true
          
          if [ ! -f "_project/research/nightly/$(date +%Y-%m-%d)/CV-$(date +%Y-%m-%d).md" ]; then
            echo "# Contract Validation Report — $(date +%Y-%m-%d)
**Status:** ⚠️ Analysis Error
**Error:** Validation script failed" > "_project/research/nightly/$(date +%Y-%m-%d)/CV-$(date +%Y-%m-%d).md"
          fi
        continue-on-error: true
      
      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-validation-report
          path: _project/research/nightly/*/CV-*.md
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Dependency Risk Mapping
  # ─────────────────────────────────────────────────────────────────
  dependency-risk:
    name: Dependency Risk Analysis
    runs-on: ubuntu-latest
    needs: contract-validation  # Sequential execution
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Dependency Risk Analysis
        id: risk
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p _project/research/nightly/$(date +%Y-%m-%d)
          node scripts/research/dependency-risk.mjs || true
          
          if [ ! -f "_project/research/nightly/$(date +%Y-%m-%d)/DR-$(date +%Y-%m-%d).md" ]; then
            echo "# Dependency Risk Report — $(date +%Y-%m-%d)
**Status:** ⚠️ Analysis Error
**Error:** Risk analysis script failed" > "_project/research/nightly/$(date +%Y-%m-%d)/DR-$(date +%Y-%m-%d).md"
          fi
        continue-on-error: true
      
      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-risk-report
          path: _project/research/nightly/*/DR-*.md
          retention-days: 30
      
      - name: Aggregate Reports
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p _project/research/nightly/$DATE
          
          # Create summary index
          echo "# Nightly Research Summary — $DATE

## Reports Generated

1. [Data Integrity Report](DI-$DATE.md)
2. [Contract Validation Report](CV-$DATE.md)  
3. [Dependency Risk Report](DR-$DATE.md)

## Quick Status
" > _project/research/nightly/$DATE/README.md
          
          # Extract status from each report
          for report in DI CV DR; do
            FILE="_project/research/nightly/$DATE/${report}-$DATE.md"
            if [ -f "$FILE" ]; then
              STATUS=$(grep -E "^\\*\\*Status:\\*\\*" "$FILE" | head -1 || echo "Status: Unknown")
              echo "- ${report}: $STATUS" >> _project/research/nightly/$DATE/README.md
            fi
          done
          
          echo "
## Action Required
- [ ] Review reports (5 min)
- [ ] Update active sprint specs if warnings found
- [ ] Execute diagnostic if critical issues detected" >> _project/research/nightly/$DATE/README.md

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Optional - Commit Reports to Repository
  # ─────────────────────────────────────────────────────────────────
  # NOTE: This is the ONLY write operation permitted
  # It writes ONLY to _project/research/nightly/ (analysis output)
  # It NEVER modifies source code
  # ─────────────────────────────────────────────────────────────────
  commit-reports:
    name: Commit Reports (Optional)
    runs-on: ubuntu-latest
    needs: [data-integrity, contract-validation, dependency-risk]
    if: github.event_name == 'workflow_dispatch'  # Only on manual trigger for safety
    
    permissions:
      contents: write  # Required ONLY for committing reports
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-report"
          merge-multiple: true
      
      - name: Setup Git
        run: |
          git config --global user.email "research[bot]@users.noreply.github.com"
          git config --global user.name "Nightly Research Bot"
      
      - name: Commit Reports (If Changed)
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p _project/research/nightly/$DATE
          
          # Copy artifacts to correct location
          cp artifacts/*/$DATE/*.md _project/research/nightly/$DATE/ 2>/dev/null || true
          
          # Stage only research outputs
          git add _project/research/nightly/
          
          # Commit if changes exist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Nightly Research: $(date +%Y-%m-%d) [skip ci]"
            git push
          fi
        continue-on-error: true
