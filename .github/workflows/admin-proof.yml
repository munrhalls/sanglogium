name: Admin proof

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run the admin proof twice and compare
        shell: bash
        run: |
          node --experimental-strip-types --import ./tools/alias-loader.mjs --import ./tests/admin/load.mjs tests/admin/admin.test.ts | tee first.txt
          node --experimental-strip-types --import ./tools/alias-loader.mjs --import ./tests/admin/load.mjs tests/admin/admin.test.ts > second.txt
          cmp first.txt second.txt
