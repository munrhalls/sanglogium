name: Autoresearch Loop

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:       # Manual trigger from GitHub UI

concurrency:
  group: autoresearch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run autoresearch
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}
        run: node scripts/research/autoresearch.mjs once

      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _project/research/autoresearch/
          if ! git diff --staged --quiet; then
            git commit -m "autoresearch: $(date -u +%Y-%m-%d-%H%M)"
            git push
          else
            echo "No new findings to commit"
          fi
