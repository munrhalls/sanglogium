product_surface:
  - path: app/(store)
    kind: web-ui
    drives: Customer storefront - browsing, search, product detail, basket, checkout.
  - path: app/(admin)
    kind: web-ui
    drives: Internal admin panel.
  - path: app/(studio)
    kind: web-ui
    drives: Sanity Studio - CMS content authoring.
  - path: app/api
    kind: api
    drives: Route handlers consumed by the storefront and webhooks (Stripe, etc.).
  - path: features/checkout/actions.ts
    kind: api
    drives: Checkout Server Actions - session init, address validation and shipping saves invoked from the storefront UI.
  - path: features/products/actions.ts
    kind: api
    drives: Wishlist Server Actions - add or remove a product from the signed-in user's wishlist from the heart button.
  - path: features/account/actions.ts
    kind: api
    drives: Account Server Actions - profile name, marketing preferences and address book changes invoked from the signed-in account pages.

test:
  instructions: |
    This repo bans agents from self-running build/lint/test/dev-server commands
    during normal work (see AGENTS.md / CLAUDE.md) - the no-mistakes evidence
    step is the one sanctioned place tests actually run.

    For a PR that only touches test files under features/*/__tests__/**, tests/**,
    app/**/__tests__/** or sanity-cms/lib/** tests (no files under app/(store), app/(admin),
    app/(studio), app/api, or app/actions): run `npm test` for real and confirm
    it passes. No live browser click-through is required - no UI or API surface
    changed.

    For a PR that touches app/(store): start the dev server, open the changed
    page(s) in a real browser, and drive the actual customer journey affected
    (e.g. type a query into search, follow it to /search, page through results,
    open a product). For app/(admin) or app/(studio): same, against that
    surface's own pages. For app/api or app/actions: exercise the changed
    route/action for real (a real request/invocation), not a source-code read.

    For a PR that moves or edits code under features/<name>/ui or app/components/ (an organization-only refactor): no behaviour change is expected. Open the storefront pages that render the moved components (for example the home page for homepage sections, /products and a product page for product components, /basket for basket components) and confirm they look and behave as before.

    For a PR that touches features/<name>/actions.ts: invoke the action for real from the UI that uses it (a real form submit or click), not a source-code read, and confirm the data change.

commands:
  test: npm test

ignore_patterns:
  - node_modules/**
  - .next/**
  - sanity-cms/**/*.types.ts
