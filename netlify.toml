[build]
  command = "npm install --legacy-peer-deps; npm run build"
  publish = ".next"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

# Add proper cache headers
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Next.js fallback handling is managed automatically by Netlify's OpenNext adapter

# Scheduled function: cleanup expired reservations every 5 minutes
[[scheduled]]
name = "cleanup-expired-reservations"
cron = "*/5 * * * *"
path = "/api/cleanup/expired-reservations"

